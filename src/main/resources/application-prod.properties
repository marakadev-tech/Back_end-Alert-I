# Port de l'application (Railway définit automatiquement PORT)
server.port=${PORT:8080}

# Nom de l'application
spring.application.name=Alerti_back

# Activer le mode debug
logging.level.root=INFO
logging.level.com.example.alerti_back=DEBUG
logging.level.org.springframework=INFO

# Supabase (depuis variables d'environnement)
supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}

# MQTT (depuis variables d'environnement)
mqtt.broker=${MQTT_BROKER}
mqtt.topic=${MQTT_TOPIC:sensors/data}
mqtt.username=${MQTT_USERNAME}
mqtt.password=${MQTT_PASSWORD}
mqtt.port=${MQTT_PORT:8883}
client-id=${CLIENT_ID:spring-boot-client}
mqttCacert=${MQTTCACERT:src/main/resources/cert/ca.crt}

# Twilio (depuis variables d'environnement)
twilio.accountSid=${TWILIO_ACCOUNTSID}
twilio.authToken=${TWILIO_AUTHTOKEN}
twilio.fromNumber=${TWILIO_FROMNUMBER}

# AWS API Gateway (depuis variables d'environnement)
aws.api-gateway.url=${AWS_API_GATEWAY_URL}
aws.lambda.api.key=${AWS_LAMBDA_API_KEY:${AWS_API_GATEWAY_URL}}
aws.api-gateway.push-endpoint=${AWS_API_GATEWAY_PUSH_ENDPOINT:/send_notification}
aws.api-gateway.sms-endpoint=${AWS_API_GATEWAY_SMS_ENDPOINT:/notifications/sms}

# OpenWeatherMap (depuis variables d'environnement)
openweathermap.api-key=${OPENWEATHERMAP_API_KEY}

# Demo Mode (depuis variables d'environnement)
demo.mode.active=${DEMO_MODE_ACTIVE:false}
demo.notification.interval=${DEMO_NOTIFICATION_INTERVAL:30000}
